name: Build and publish Apple Silicon DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的版本标签，例如 v2.1.0（仅备用云端构建）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Require numbered release notes
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          grep -Eq '^1[.] ' "$notes"
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Run core and filesystem regression tests
        run: ./cleanMac/Scripts/test_p0.sh
      - name: Build and validate Apple Silicon DMG
        run: BUILD_ARCH=arm64 ./cleanMac/Scripts/make_dmg.sh
      - name: Verify Apple Silicon DMG
        run: |
          hdiutil verify cleanMac/build/cleanMac-arm64.dmg
          test "$(lipo -archs cleanMac/build/dd-arm64/Build/Products/Release/cleanMac.app/Contents/MacOS/cleanMac)" = arm64
          shasum -a 256 cleanMac/build/cleanMac-arm64.dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" cleanMac/build/cleanMac-arm64.dmg \
            --title "cleanMac ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
